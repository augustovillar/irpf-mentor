[project]
name = "irpf-core"
version = "0.1.0"
description = "Pure library: schema, .DBK parser/encoder, validators, calculations for Brazilian IRPF"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "irpf-knowledge",
]

[tool.uv.sources]
irpf-knowledge = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irpf_core"]
