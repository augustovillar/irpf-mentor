[project]
name = "irpf-mcp"
version = "0.1.0"
description = "MCP server exposing IRPF tools (decode, explain, lookup, validate, diff, ...)"
requires-python = ">=3.11"
dependencies = [
    "irpf-core",
    "irpf-knowledge",
    "mcp>=1.0",
    "pydantic>=2.7",
]

[project.scripts]
irpf-mcp = "irpf_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irpf_mcp"]

[tool.uv.sources]
irpf-core = { workspace = true }
irpf-knowledge = { workspace = true }
