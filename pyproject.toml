[project]
name = "irpf-mentor"
version = "0.1.0"
description = "Brazilian IRPF tax-declaration toolkit: MCP server + Claude Code skills + Codex agents"
requires-python = ">=3.11"
dependencies = [
    "irpf-core",
    "irpf-knowledge",
    "irpf-mcp",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]
extractors = [
    "docling>=2.0",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The workspace root is a metapackage: no importable code of its own, it just
# pulls in the three irpf-* members. `bypass-selection` lets hatchling build a
# metadata-only wheel so `uvx --from git+<repo> irpf-mcp` works without a clone
# (otherwise setuptools' legacy fallback fails on the repo's flat layout).
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
irpf-core = { workspace = true }
irpf-knowledge = { workspace = true }
irpf-mcp = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]
