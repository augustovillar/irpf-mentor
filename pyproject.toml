[project]
name = "irpf-mentor"
version = "0.1.0"
description = "Brazilian IRPF tax-declaration toolkit: MCP server + Claude Code skills + Codex agents"
requires-python = ">=3.11"
dependencies = [
    "irpf-core",
    "irpf-knowledge",
    "irpf-mcp",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]
extractors = [
    "docling>=2.0",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
irpf-core = { workspace = true }
irpf-knowledge = { workspace = true }
irpf-mcp = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]
